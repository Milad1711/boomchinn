<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بوم چین — بدون اینترنت</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #d9f7ea, #a8ecd9 55%, #7fe0d4);
    font-family: sans-serif; color: #0f766e;
  }
  .card { background: #fff; border-radius: 24px; padding: 32px 28px; text-align: center;
          box-shadow: 0 10px 30px rgba(13, 148, 136, .18); max-width: 320px; }
  h1 { font-size: 20px; margin: 12px 0 8px; color: #134e4a; }
  p { font-size: 14px; font-weight: 600; line-height: 1.9; margin: 0 0 20px; color: #0f766e; }
  button { border: 0; border-bottom: 4px solid #0f766e; background: #0d9488; color: #fff;
           font-weight: 900; font-size: 16px; padding: 14px 40px; border-radius: 18px; cursor: pointer; }
  button:active { transform: translateY(2px); border-bottom-width: 0; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:44px">&#127918;</div>
    <h1>اتصال برقرار نیست</h1>
    <p>برای بازی کردن به اینترنت نیاز است.<br />وای‌فاای یا اینترنت گوشی را چک کن و دوباره تلاش کن.</p>
    <button onclick="location.href='https://boomchinn.vercel.app'">تلاش دوباره</button>
  </div>
</body>
</html>
